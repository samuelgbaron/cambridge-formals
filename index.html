<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thirty-one formals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
:root{
  --field:#E3ECE6; --surface:#F6F9F7; --ink:#18233A; --muted:#56665F; --line:#C9D7CF;
  --gold:#A57A22; --done:#2D6A4E; --done-soft:#D5E8DC; --focus:#2E5AA8;
  --paper:#F4EEDD; --paper-edge:#D9CDAE; --plate-ink:#2A6E8C; --plate-muted:#9A9384;
  --serif:"IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sc:"IM Fell English SC","IM Fell English",Palatino,Georgia,serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --field:#0E1814; --surface:#15221D; --ink:#E5EDE8; --muted:#97A9A0; --line:#2A3B34;
    --gold:#D8B25C; --done:#86C9A5; --done-soft:#1E3A2E; --focus:#8FB6FF;
    --paper:#E6DEC8; --paper-edge:#BFB291; color-scheme:dark;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--field);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 48px}
h1{font:400 clamp(2.5rem,9vw,4.25rem)/1 var(--serif);margin:0 0 10px;letter-spacing:-.01em}
.tally{font:italic 400 1.35rem/1.3 var(--serif);color:var(--muted);margin:0 0 24px}
.tally b{font-style:normal;color:var(--ink);font-weight:400}

/* the plate of arms, after an old encyclopedia colour gallery */
.plate{background:var(--paper);border:1px solid var(--paper-edge);border-radius:3px;padding:18px 14px 14px;margin:0 0 32px;
  box-shadow:0 1px 0 rgb(0 0 0 / .04),0 12px 28px -18px rgb(40 30 10 / .45)}
.plate-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 6px 14px;color:var(--plate-ink);font:italic 400 1.05rem/1.2 var(--serif)}
.plate-head span:last-child{font-style:normal;font-family:var(--sc);font-size:.95rem}
.arms{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:14px 6px;margin:0;padding:0;list-style:none}
.shield{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;background:none;border:0;padding:4px 2px;cursor:pointer;border-radius:4px;color:var(--plate-ink)}
.shield img,.shield .ph{height:66px;width:100%;object-fit:contain;transition:filter .4s,opacity .4s}
.shield .cap{font:400 .74rem/1.15 var(--sc);letter-spacing:.06em;text-align:center;color:var(--plate-ink);transition:color .4s}
.shield:not(.on) img,.shield:not(.on) .ph{filter:grayscale(1) contrast(.9);opacity:.24}
.shield.vis img{opacity:.7}
.shield:not(.on) .cap{color:var(--plate-muted)}
.shield.vis .cap{color:#6F6A5E}
.shield:not(.on):hover img,.shield:not(.on):hover .ph{opacity:.85}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px;margin:16px 6px 0;font:italic .85rem/1.3 var(--serif);color:#6F6A5E}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:12px;border-radius:1px 1px 6px 6px;background:var(--plate-ink)}
.legend i.g{background:#8C887E}
.legend i.f{background:#8C887E;opacity:.3}
.plate-foot{margin:6px 6px 0;font:italic .85rem/1.3 var(--serif);color:var(--plate-muted);text-align:center}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{font:500 .875rem var(--sans);color:var(--muted);background:none;border:0;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
@media (max-width:420px){.seg button{padding:7px 9px;font-size:.8125rem}}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
select{font:500 .875rem var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px}

ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;align-items:center}
.row.dined{background:linear-gradient(90deg,var(--done-soft),transparent 70%)}
.row.visited{background:linear-gradient(90deg,rgb(128 128 128 / .1),transparent 70%)}
.main{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:12px 4px;cursor:pointer;font:inherit}
.mini{flex:none;width:38px;height:46px;object-fit:contain}
.nm{display:block;font:400 1.3rem/1.15 var(--serif)}
.meta{display:block;font-size:.8125rem;color:var(--muted);margin-top:2px}
.row.dined .meta{color:var(--done)}
.acts{display:flex;gap:6px;margin-right:4px}
.tick{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .2s}
.tick svg{width:20px;height:20px}
.tick.v[aria-pressed="true"]{border-color:var(--done);color:var(--done);background:var(--done-soft)}
.tick.d[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--surface)}
.hint{font-size:.8125rem;color:var(--muted);margin:0 0 10px}
.tick:active{transform:scale(.92)}
.detail{grid-column:1/-1;padding:0 4px 18px 56px;display:grid;gap:12px}
.detail[hidden]{display:none}
.detail label{display:grid;gap:4px;font-size:.8125rem;color:var(--muted)}
.detail input,.detail textarea{font:400 1rem var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.detail textarea{min-height:76px;resize:vertical}
.detail a{color:var(--focus);font-size:.875rem;justify-self:start}
.empty{padding:28px 4px;color:var(--muted);font-style:italic;font-family:var(--serif);font-size:1.15rem}

footer{margin-top:36px;font-size:.75rem;color:var(--muted);display:grid;gap:6px}
.status{font-weight:600;color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){
  .wrap{padding:22px 14px 40px}
  .plate{padding:14px 8px 10px}
  .arms{grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:12px 2px}
  .shield img,.shield .ph{height:54px}
  .shield .cap{font-size:.66rem;letter-spacing:.04em}
  .detail{padding-left:4px}
}
</style>
</head>

const byYear=[...L].sort((a,b)=>a.year-b.year||a.name.localeCompare(b.name));
const byName=[...L].sort((a,b)=>a.name.replace(/^St /,"Saint ").localeCompare(b.name.replace(/^St /,"Saint ")));

// crest images: kept as data in the page, shown through short blob: URLs
const crestData=(()=>{try{return JSON.parse(document.getElementById("crests").textContent)}catch(e){return {}}})();
const crestURL={};
for(const [id,uri] of Object.entries(crestData)){
  try{const [head,b64]=uri.split(",");const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    crestURL[id]=URL.createObjectURL(new Blob([u8],{type:head.slice(5).split(";")[0]}))}catch(e){crestURL[id]=uri}
}
const placeholder='<svg class="ph" viewBox="0 0 100 120" aria-hidden="true"><path d="M8 8h84v46c0 30-20 48-42 58C28 102 8 84 8 54z" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="7 5" opacity=".55"/></svg>';
const crest=(c,cls)=>crestURL[c.id]?`<img class="${cls}" src="${crestURL[c.id]}" alt="" loading="lazy" decoding="async">`:(cls==="mini"?placeholder.replace('class="ph"','class="mini"'):placeholder);

let state;
try{state=JSON.parse(document.getElementById("state").textContent)}catch(e){state={entries:{}}}
if(!state.entries)state.entries={};
// earlier versions had one "done" tick, which meant a formal: carry it over as dined
function migrate(s){for(const e of Object.values(s.entries||{})){if(e&&e.done!==undefined){if(e.done){e.dined=true;e.visited=true}delete e.done}}return s}
migrate(state);
const ui={filter:"all",sort:"year",open:null};
try{Object.assign(ui,JSON.parse(localStorage.getItem("cf-ui")||"{}"))}catch(e){}
if(!["all","todo","visited","dined"].includes(ui.filter))ui.filter=ui.filter==="done"?"dined":"all";
try{const s=JSON.parse(sessionStorage.getItem("cf-restore")||"null");if(s){ui.open=s.open;sessionStorage.removeItem("cf-restore");requestAnimationFrame(()=>scrollTo(0,s.y||0))}}catch(e){}
let mode="pending", artifact=null, timer=null, status="";

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>{if(!d)return"";const[y,m,dd]=d.split("-").map(Number);return new Date(y,m-1,dd).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const words=["Nought","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen","Twenty","Twenty-one","Twenty-two","Twenty-three","Twenty-four","Twenty-five","Twenty-six","Twenty-seven","Twenty-eight","Twenty-nine","Thirty","Thirty-one"];
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const icoVisit=svg('<path d="M4.5 20.5v-10a7.5 7.5 0 0 1 15 0v10"/><path d="M3 20.5h18"/><path d="M9.5 20.5v-6a2.5 2.5 0 0 1 5 0v6"/>');
const icoDine=svg('<path d="M7 3v6.5a2 2 0 0 0 2 2 2 2 0 0 0 2-2V3"/><path d="M9 3v18"/><path d="M17 21V3c-2.2 1.4-3 4-3 7.5V13h3"/>');
const ro=()=>mode==="readonly";
const ent=id=>state.entries[id]||{};
const isDined=id=>!!ent(id).dined;
const isVisited=id=>!!(ent(id).visited||ent(id).dined);

function render(){
  const dinedN=L.filter(c=>isDined(c.id)).length, left=N-dinedN;
  const visN=L.filter(c=>isVisited(c.id)&&!isDined(c.id)).length;
  const tally = dinedN===N ? `All thirty-one. Hinc lucem et pocula sacra.`
    : dinedN===0 ? `<b>Thirty-one</b> halls to dine in. Pick your first.`
    : `<b>${words[dinedN]}</b> dined, <b>${words[left].toLowerCase()}</b> to go.`;
  const arms=byYear.map(c=>{const on=isDined(c.id), vis=!on&&isVisited(c.id);
    return `<li><button class="shield${on?" on":vis?" vis":""}" data-jump="${c.id}" aria-label="${esc(c.name)}, ${on?"dined":vis?"visited":"not yet visited"}">${crest(c,"big")}<span class="cap">${esc(c.short)}</span></button></li>`}).join("");
  const order=ui.sort==="name"?byName:byYear;
  const shown=order.filter(c=>{const d=isDined(c.id), v=isVisited(c.id);
    return ui.filter==="all"||(ui.filter==="dined"?d:ui.filter==="visited"?(v&&!d):!d)});
  const rows=shown.map(c=>{
    const e=ent(c.id), open=ui.open===c.id, d=isDined(c.id), v=isVisited(c.id);
    const meta=`Founded ${c.year}`+(d?(e.date?`, dined ${fmt(e.date)}`:", dined"):v?", visited":"");
    return `<li class="row${d?" dined":v?" visited":""}" id="c-${c.id}">
<button class="main" data-open="${c.id}" aria-expanded="${open}" aria-controls="d-${c.id}">${crest(c,"mini")}<span><span class="nm">${esc(c.name)}</span><span class="meta">${meta}</span></span></button>
<span class="acts"><button class="tick v" data-visit="${c.id}" aria-pressed="${v}" aria-label="${esc(c.name)}: ${v?"visited, tap to undo":"mark as visited"}" title="Visited" ${ro()?"disabled":""}>${icoVisit}</button><button class="tick d" data-dine="${c.id}" aria-pressed="${d}" aria-label="${esc(c.name)}: ${d?"dined, tap to undo":"mark as dined"}" title="Dined" ${ro()?"disabled":""}>${icoDine}</button></span>
<div class="detail" id="d-${c.id}" ${open?"":"hidden"}>
<label>Date of formal<input type="date" data-date="${c.id}" value="${esc(e.date||"")}" ${ro()?"disabled":""}></label>
<label>Notes<textarea data-note="${c.id}" placeholder="Who signed you in, the menu, the best bit" ${ro()?"disabled":""}>${esc(e.note||"")}</textarea></label>
<a href="https://en.wikipedia.org/wiki/${c.wiki}" target="_blank" rel="noopener">Read about ${esc(c.short)} on Wikipedia</a>
</div></li>`}).join("");
  const empty = ui.filter==="dined" ? "No formals yet. Tap the knife and fork when you’ve dined somewhere."
    : ui.filter==="visited" ? "Colleges you’ve visited but not dined at will appear here."
    : "You’ve dined at every college. Time to start again from Peterhouse.";
  const statusText = status || (mode==="live"?"Changes save to this page, so they’re there on any device.":mode==="local"?"Changes are saved in this browser only.":mode==="readonly"?"You’re viewing someone else’s list, so it’s read-only.":"");
  document.getElementById("app").innerHTML=`
<header><h1>Thirty-one formals</h1><p class="tally">${tally}</p>
<section class="plate" aria-label="Arms of the colleges, oldest first">
<div class="plate-head"><span>The arms of the colleges</span><span>${dinedN} dined${visN?`, ${visN} visited`:""}</span></div>
<ul class="arms">${arms}</ul>
<div class="legend"><span><i></i>Dined</span><span><i class="g"></i>Visited</span><span><i class="f"></i>Not yet</span></div>
<p class="plate-foot">From Peterhouse, 1284, to Robinson, 1977. Tap a shield to find its college.</p>
</section></header>
<p class="hint">Tap the archway when you’ve visited a college, and the knife and fork when you’ve dined there.</p>
<div class="bar"><div class="seg" role="group" aria-label="Show">
<button data-filter="all" aria-pressed="${ui.filter==="all"}">All</button><button data-filter="todo" aria-pressed="${ui.filter==="todo"}">To go ${left}</button><button data-filter="visited" aria-pressed="${ui.filter==="visited"}">Visited ${visN}</button><button data-filter="dined" aria-pressed="${ui.filter==="dined"}">Dined ${dinedN}</button></div>
<select data-sort aria-label="Sort"><option value="year"${ui.sort==="year"?" selected":""}>Oldest first</option><option value="name"${ui.sort==="name"?" selected":""}>A to Z</option></select></div>
<ol>${rows||`<li class="empty">${empty}</li>`}</ol>
<footer><span class="status" aria-live="polite">${esc(statusText)}</span>
<span>Coats of arms from Wikipedia and Wikimedia Commons, published there under public-domain or Creative Commons licences. Founding dates from Wikipedia’s list of Cambridge colleges.</span></footer>`;
}

function saveUI(){try{localStorage.setItem("cf-ui",JSON.stringify({filter:ui.filter,sort:ui.sort}))}catch(e){}}
function docFor(s){
  const css=document.getElementById("css").textContent, js=document.getElementById("main").textContent;
  const crests=document.getElementById("crests").textContent;
  const json=JSON.stringify(s).replace(/</g,"\\u003c");
  return HEAD_OPEN+'<style id="css">'+css+'</style>\n</head>\n<body>\n<div class="wrap" id="app"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script type="application/json" id="crests">'+crests+'<\/script>\n<script id="main">'+js+'<\/script>\n</body>\n</html>\n';
}
function persist(){
  if(mode==="local"){try{localStorage.setItem("cf-state",JSON.stringify(state))}catch(e){}return}
  if(mode!=="live")return;
  clearTimeout(timer); status="Saving…"; updateStatus();
  timer=setTimeout(async()=>{
    try{sessionStorage.setItem("cf-restore",JSON.stringify({y:scrollY,open:ui.open}))}catch(e){}
    try{await artifact.publish(docFor(state))}
    catch(err){const code=err&&err.code;
      if(code==="conflict")return;
      if(["not_writer","not_granted","consent_required","capability_disabled","capability_removed","not_declared"].includes(code)){mode="local";status="";try{localStorage.setItem("cf-state",JSON.stringify(state))}catch(e){};render();return}
      status=code==="rate_limited"?"Saving paused for a moment. Your next change will save everything.":"That change didn’t save. Try ticking it again.";updateStatus()}
  },900);
}
function updateStatus(){const el=document.querySelector(".status");if(el)el.textContent=status}

const app=document.getElementById("app");
app.addEventListener("click",ev=>{
  const t=ev.target.closest("button");if(!t)return;
  if(t.dataset.visit||t.dataset.dine){if(ro())return;const id=t.dataset.visit||t.dataset.dine;const e=state.entries[id]||(state.entries[id]={});
    if(t.dataset.dine){e.dined=!e.dined;if(e.dined){e.visited=true;if(!e.date)e.date=today()}}
    else if(e.visited||e.dined){e.visited=false;e.dined=false}else{e.visited=true}
    const sel=t.dataset.dine?`[data-dine="${id}"]`:`[data-visit="${id}"]`;
    render(); persist(); document.querySelector(sel)?.focus(); return}
  if(t.dataset.open){ui.open=ui.open===t.dataset.open?null:t.dataset.open;render();document.querySelector(`[data-open="${t.dataset.open}"]`)?.focus();return}
  if(t.dataset.filter){ui.filter=t.dataset.filter;saveUI();render();return}
  if(t.dataset.jump){const id=t.dataset.jump;ui.filter="all";ui.open=id;render();const r=document.getElementById("c-"+id);
    r?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});r?.querySelector(".main")?.focus({preventScroll:true});}
});
app.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.matches("[data-sort]")){ui.sort=t.value;saveUI();render();return}
  if(ro())return;
  if(t.dataset.date!==undefined){const e=state.entries[t.dataset.date]||(state.entries[t.dataset.date]={});e.date=t.value;render();persist()}
  if(t.dataset.note!==undefined){const e=state.entries[t.dataset.note]||(state.entries[t.dataset.note]={});e.note=t.value.slice(0,1000);persist()}
});

render();
(async()=>{
  try{artifact = window.claude && window.claude.use ? await window.claude.use("artifact") : null}catch(e){artifact=null}
  if(artifact){mode="live"}else{
    mode="local";
    try{const s=JSON.parse(localStorage.getItem("cf-state")||"null");if(s&&s.entries&&!Object.keys(state.entries).length)state=migrate(s)}catch(e){}
  }
  render();
})();
})();
</script>
</body>
</html>
